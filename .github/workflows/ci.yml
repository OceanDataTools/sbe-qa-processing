name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push to a PR cancels its superseded run. Pushes to main get a group per commit, because
  # GitHub keeps only one pending run per group and would otherwise drop queued main runs
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml instead of re-resolving
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.11.3: before tarfile's "data" filter (3.11.4), like Debian 12's 3.11.2, which
        # INSTALL.md recommends there and uv doesn't build
        python-version: ["3.11.3", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # The README says the core and R2R commands run on macOS and Windows too
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    # bash on every OS, including Windows, so the steps behave the same everywhere
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      # Nothing is fetched from R2R or Natural Earth: the tests unpack the R2R validation filesets
      # committed in tests/data/, so every R2R comparison runs on every OS, and draw maps without
      # Natural Earth. -rs lists any test that skips; -n auto runs them on every core
      - run: uv run --locked pytest -rs -n auto

  openvdm-contract:
    # The OpenVDM hook against OpenVDM's own code: how it runs the hook command the README
    # documents, its update_md5_summary.py and the cruise config file it writes
    # (tests/test_openvdm_contract.py). Against OpenVDM's 2.17 branch, which the hook targets
    name: OpenVDM contract (2.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OceanDataTools/openvdm
          ref: "2.17"
          path: openvdm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # OpenVDM's own environment, as its installer makes it: venv/ in its checkout
      - run: uv venv --python 3.12 openvdm/venv
      - run: VIRTUAL_ENV=openvdm/venv uv pip install -r openvdm/requirements.txt
      - run: uv sync --locked --extra openvdm
      # OPENVDM_CONTRACT_REQUIRED: OpenVDM not found is an error here, not a skip
      - run: uv run --locked pytest tests/test_openvdm_contract.py
        env:
          OPENVDM_SOURCE: ${{ github.workspace }}/openvdm
          OPENVDM_CONTRACT_REQUIRED: "1"
