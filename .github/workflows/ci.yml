name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled, but every push to main is tested
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml instead of re-resolving
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The README says the core and R2R commands run on macOS and Windows too
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    # bash on every OS, including Windows, so the steps behave the same everywhere
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      # Without data/, the R2R comparison tests skip; the r2r job runs them
      - run: uv run --locked pytest -rs

  r2r:
    name: Tests with the R2R validation filesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # Released R2R filesets never change, so they're cached under a fixed key and only
      # downloaded from R2R on a cache miss; change the key's suffix to fetch them again
      - name: Restore the R2R filesets
        id: filesets
        uses: actions/cache@v4
        with:
          path: data
          key: r2r-filesets-SP2613_169847-RR2605_170644-BH18-18_132368-v1
      - name: Fetch the R2R filesets
        if: steps.filesets.outputs.cache-hit != 'true'
        run: |
          for fileset in "SP2613 169847" "RR2605 170644" "BH18-18 132368"; do
            # R2R can be slow or briefly unreachable: three tries, replacing partial downloads
            for attempt in 1 2 3; do
              uv run --locked sbe-qa-processing r2r fetch-fileset $fileset --force && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 30
            done
          done
      # Every R2R comparison runs; -rs lists any test that still skips
      - run: uv run --locked pytest -rs
