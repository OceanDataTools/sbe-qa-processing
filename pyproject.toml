[project]
name = "sbe-qa-processing"
version = "0.1.0"
description = "Quality assessment reports (PDF, SVG plots, Jupyter notebook) for Sea-Bird SBE 9/911plus CTD casts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  # The fork's integration branch: upstream v3.0.0 plus every pending fix. A direct reference,
  # so pip installs it too (pip ignores [tool.uv.sources]); PyPI's seabirdscientific is 2.x
  "seabirdscientific @ git+https://github.com/webbpinner/seabirdscientific@integration",
  "gsw >= 3.6.19",
  "matplotlib >= 3.9",
  "nbformat >= 5.10",
  "numpy >= 2.0",
  "pandas >= 2.2.2",
  "reportlab>=4.2",
  "svglib>=1.5",
  "cartopy>=0.24",
  "shapely>=2.0",
]

[project.optional-dependencies]
# The OpenVDM hook reads openvdm.yaml
openvdm = ["pyyaml>=6.0"]

[project.scripts]
sbe-qa-processing = "sbe_qa_processing.cli:main"

[dependency-groups]
dev = [
  "nbclient >= 0.10",
  "ipykernel >= 6.29",
  "pytest >= 8.3",
  "pyyaml >= 6.0",  # the openvdm extra, for its tests
  "ruff >= 0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
